<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Vielen Dank – KREAKTIVMÖBEL</title>
  <link rel="icon" type="image/png" href="https://kreaktivmoebel.de/wp-content/uploads/2024/02/logoRGB_72ppi_Web.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=Fuggles&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#ffffff;
      --text:#0b1220;
      --muted:#5b6474;
      --border:rgba(15, 23, 42, .10);
      --accent:#1d4ed8;
    }
    *{margin:0; padding:0; box-sizing:border-box}
    body{
      font-family:'DM Sans', ui-sans-serif, system-ui, sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }
    header{
      padding:18px 22px;
      border-bottom:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:center;
    }
    header img{height:32px}
    .thankyou{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:64px 22px;
      text-align:center;
    }
    .thankyou-inner{max-width:520px}
    .icon-circle{
      width:64px; height:64px;
      border-radius:50%;
      background:rgba(34,139,34,.08);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      margin-bottom:24px;
    }
    h1{
      font-family:'Geist', ui-sans-serif, system-ui, sans-serif;
      font-weight:600;
      font-size:clamp(26px, 3.5vw, 36px);
      line-height:1.15;
      margin-bottom:16px;
      letter-spacing:-0.03em;
    }
    p{
      color:var(--muted);
      font-size:16px;
      line-height:1.6;
    }
    .back-link{
      display:inline-block;
      margin-top:32px;
      font-size:14px;
      color:var(--muted);
      text-decoration:none;
      transition:color .15s ease;
    }
    .back-link:hover{color:var(--text)}
    footer{
      padding:22px 0;
      border-top:1px solid var(--border);
      text-align:center;
      font-size:13px;
      color:var(--muted);
    }
    footer a{color:var(--muted); text-decoration:none; transition:color .15s ease}
    footer a:hover{color:var(--text)}
    .foot{
      display:flex; gap:14px; flex-wrap:wrap; justify-content:center;
      align-items:center; padding:0 22px;
    }
  </style>

  <!-- Meta Pixel – replace PIXEL_ID_HERE with your real Pixel ID -->

    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}

    fbq('init', 'PIXEL_ID_HERE');

  </script>

</head>
<body>

  <header>
    <a href="index.html">
      <img src="https://kreaktivmoebel.de/wp-content/uploads/2024/02/logoRGB_72ppi_Web.png" alt="KREAKTIVMÖBEL">
    </a>
  </header>

  <main class="thankyou">
    <div class="thankyou-inner">
      <div class="icon-circle">
        <svg width="28" height="28" fill="none" stroke="#228B22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>
      </div>
      <h1>Vielen Dank für dein Interesse</h1>
      <p>Wir werden uns in Kürze bei dir persönlich melden.</p>
      <a href="index.html" class="back-link">&larr; Zurück zur Startseite</a>
    </div>
  </main>

  <footer>
    <div class="foot">
      <div>&copy; <script>document.write(new Date().getFullYear())</script> KREAKTIVMÖBEL GmbH</div>
      <span style="color:var(--border);">&middot;</span>
      <a href="https://kreaktivmoebel.de/impressum/" target="_blank" rel="noopener noreferrer">Impressum</a>
      <span style="color:var(--border);">&middot;</span>
      <a href="https://kreaktivmoebel.de/datenschutzerklaerung/" target="_blank" rel="noopener noreferrer">Datenschutz</a>
    </div>
  </footer>

</body>
</html>
